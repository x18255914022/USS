services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # внутри контейнера localhost — это сам контейнер, Redis доступен по имени сервиса
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    ports:
      - "3001:3001"
    command: ["pnpm", "--filter", "@app/api", "dev"]
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["pnpm", "--filter", "@app/web", "dev"]
  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      # внутри контейнера localhost — это сам контейнер, Redis доступен по имени сервиса
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    command: ["pnpm", "--filter", "@app/worker", "dev"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  redis_data:
