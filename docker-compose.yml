services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # внутри контейнера localhost — это сам контейнер, Redis доступен по имени сервиса
      - REDIS_URL=redis://redis:6379
      # Postgres доступен по имени сервиса внутри сети compose
      - DATABASE_URL=postgresql://uss:uss_dev_password@postgres:5432/uss
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: ["pnpm", "--filter", "@app/api", "dev"]
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["pnpm", "--filter", "@app/web", "dev"]
  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      # внутри контейнера localhost — это сам контейнер, Redis доступен по имени сервиса
      - REDIS_URL=redis://redis:6379
      # Postgres доступен по имени сервиса внутри сети compose
      - DATABASE_URL=postgresql://uss:uss_dev_password@postgres:5432/uss
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@app/worker", "dev"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=uss
      - POSTGRES_PASSWORD=uss_dev_password
      - POSTGRES_DB=uss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uss -d uss"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
  postgres_data:
